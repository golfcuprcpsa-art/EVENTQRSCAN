<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Olivarez Golf Cup 2026 — QR Attendance</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#f3f6fa;font-family:Arial,sans-serif;color:#17365d;padding:16px}
.wrap{max-width:540px;margin:auto}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 5px 20px #0002}
h1{text-align:center;font-size:22px;margin:4px 0} h2{text-align:center;font-size:14px;margin:6px 0 20px}
#reader{width:100%;overflow:hidden;border-radius:14px}
button,input,select{width:100%;padding:14px;margin-top:10px;border-radius:11px;font-size:16px}
button{border:0;font-weight:700;cursor:pointer}.primary{background:#17365d;color:white}.secondary{background:#e8eef6;color:#17365d}.stop{background:#8d2020;color:white}
input,select{border:1px solid #bbb;background:white}.controls{display:none}
.result{display:none;margin:10px 0 12px;padding:16px;border-radius:12px;text-align:center;line-height:1.5;position:sticky;top:8px;z-index:50;box-shadow:0 4px 14px #0002}
.unpaid{display:block;background:#fde5e5;color:#9b0000;border:2px solid #b42318}.info{display:block;background:#e7eff8}.success{display:block;background:#dff3e4;color:#176b2c}.duplicate{display:block;background:#fff3cd;color:#725000}.error{display:block;background:#fde5e5;color:#9b0000}
.name{font-size:24px;font-weight:700;margin:8px}.manual{border-top:1px solid #ddd;margin-top:18px;padding-top:16px}
.small{font-size:13px;line-height:1.5;color:#667}.debug{font-size:11px;color:#777;word-break:break-word;margin-top:8px}

@media(max-width:600px){
  body{padding:8px}
  .card{padding:14px;border-radius:16px}
  h1{font-size:20px}
  #reader{max-height:48vh}
  #reader video{max-height:48vh!important;object-fit:cover!important}
  .result{font-size:16px}
  .name{font-size:25px}
}

.compact-controls{gap:8px;margin-top:8px}
.compact-controls button{width:auto;flex:1;margin-top:0;padding:11px}
.payment-stop{font-size:24px;font-weight:900;margin:8px 0}
.payment-instruction{font-size:17px;font-weight:700}
@media(max-width:600px){
  .compact-controls{display:none}
  .compact-controls[style*="block"]{display:flex!important}
  .manual{margin-top:12px;padding-top:12px}
}

/* MOBILE-ONLY LAYOUT OPTIMIZATION — scanning logic unchanged */
@media (max-width:600px){
  body{padding:5px}
  .wrap{max-width:100%}
  .card{padding:10px;border-radius:12px}
  h1{font-size:17px;line-height:1.15;margin:2px 0}
  h2{font-size:11px;margin:3px 0 7px}
  .result{padding:9px 10px;margin:5px 0 7px;line-height:1.25;
          border-radius:10px;top:4px;font-size:14px}
  .result .name{font-size:21px;margin:3px 0}
  .result .payment{font-size:18px;margin:4px 0}
  .result .payment-stop{font-size:19px;margin:3px 0}
  .result .payment-instruction{font-size:14px}
  #nextBtn{padding:13px 8px;margin:5px 0 7px;font-size:17px;
           position:sticky;top:4px;z-index:51}
  #reader{max-height:44vh;border-radius:10px}
  #reader video{max-height:44vh!important;object-fit:contain!important}
  button,input{font-size:14px;padding:10px;margin-top:6px}
  .compact-controls{display:none;gap:6px;margin-top:6px}
  .compact-controls[style*="block"],.compact-controls[style*="flex"]{display:flex!important}
  .compact-controls button{min-width:0;flex:1;padding:9px 5px;font-size:12px;
                            white-space:nowrap}
  .manual{margin-top:8px;padding-top:8px}
  .manual .small{font-size:11px}
  .debug{margin-top:4px}
}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>THE OLIVAREZ GOLF CUP 2026</h1>
<h2>QR ATTENDANCE SCANNER</h2>

<div id="result" class="result"></div>
<div id="debug" class="debug"></div>
<button id="nextBtn" class="primary" style="display:none;background:#176b2c" onclick="scanNextPlayer()">▶ SCAN NEXT PLAYER</button>
<div id="reader"></div>
<button id="startBtn" class="primary" onclick="startCamera()">📷 START CAMERA</button>
<div id="controls" class="controls compact-controls">
<button id="switchBtn" class="secondary" onclick="switchCamera()">🔄 SWITCH CAMERA</button>
<button class="stop" onclick="stopCamera()">■ STOP CAMERA</button>
</div>
<div class="manual">
<b>Backup Check-In</b>
<div class="small">Enter the Player ID if camera scanning is unavailable.</div>
<input id="manualCode" placeholder="OGC2026-0001" onkeydown="if(event.key==='Enter')manualCheckIn()">
<button class="secondary" onclick="manualCheckIn()">CHECK IN PLAYER</button>
</div>
</div></div>

<script>
// ============================================================
// SETUP
// API_URL is already configured for your Apps Script deployment.
// Replace ONLY the SCANNER_KEY value below with the exact
// scannerKey you placed in Code.gs.
// ============================================================
const API_URL = "https://script.google.com/macros/s/AKfycbyGHyVpadT0ZUnalxitghYKvunc1NaRwjs7Z0O3_WN2VTwYkf7GA-ThwSHGrp7-a7lS/exec";
// ============================================================

let qr=null,cameras=[],current=0,busy=false,lastCode="",lastTime=0;
let scanFailures=0,scanStartedAt=0;

function setResult(cls,html){const r=document.getElementById("result");r.className="result "+cls;r.innerHTML=html;r.style.display="block"}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function tone(ok){try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:240;g.gain.setValueAtTime(.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.start();o.stop(c.currentTime+.18)}catch(e){}}


// iOS-compatible camera lifecycle: request the rear camera directly first.
let cameraOpening=false;
let activeFacing="environment";
async function startCamera(){
  if(cameraOpening)return;
  cameraOpening=true;
  document.getElementById("debug").textContent="";
  try{
    if(!window.isSecureContext)throw new Error("Camera requires HTTPS. Open the GitHub Pages https:// link in Safari.");
    if(!navigator.mediaDevices?.getUserMedia)throw new Error("Camera API unavailable. Open this page directly in Safari, not inside an app's browser.");
    if(typeof Html5Qrcode==="undefined")throw new Error("QR library did not load. Check your internet connection.");
    setResult("info","Opening rear camera...");
    await openCamera("environment");
  }catch(e){cameraError(e)}
  finally{cameraOpening=false}
}
async function searchCameras(open=true){
  try{
    cameras=(await Html5Qrcode.getCameras())||[];
    fillCameraList();
    if(open)await startCamera();
  }catch(e){cameraError(e)}
}
function fillCameraList(){
  document.getElementById("switchBtn").style.display="block"; // iOS may report only one device even when both cameras exist
}
async function openCamera(facing="environment"){
  if(qr){
    try{if(qr.isScanning)await qr.stop()}catch(e){}
    try{qr.clear()}catch(e){}
    qr=null;
  }
  document.getElementById("reader").innerHTML="";
  qr=new Html5Qrcode("reader",{verbose:false});
  // Larger scanning window and native video aspect ratio improve QR detection on iOS.
  const config={fps:15, qrbox:(w,h)=>{
    const side=Math.floor(Math.min(w,h)*0.9);
    return {width:side,height:side};
  }, disableFlip:false};
  const onScan=text=>{scanFailures=0;checkPlayer(text,true)};
  const onFailure=()=>{scanFailures++;if(scanFailures===100 && !busy){
    document.getElementById("debug").textContent="QR not detected yet. Hold the code 15–25 cm away, ensure good lighting, and keep the whole code visible.";
  }};
  // Safari: request front/rear explicitly, not by camera list position.
  // Try the requested facing mode, then a matching device ID if necessary.
  const requested={facingMode:facing};
  try{
    await qr.start(requested,config,onScan,onFailure);
  }catch(firstError){
    cameras=(await Html5Qrcode.getCameras())||[];
    fillCameraList();
    const pattern=facing==="environment"?/back|rear|environment|world/i:/front|face|user/i;
    const match=cameras.find(c=>pattern.test(c.label||""));
    if(!match)throw firstError;
    try{qr.clear()}catch(e){}
    qr=new Html5Qrcode("reader",{verbose:false});
    await qr.start(match.id,config,onScan,onFailure);
  }
  activeFacing=facing;
  document.getElementById("startBtn").style.display="none";
  document.getElementById("controls").style.display="flex";
  document.getElementById("nextBtn").style.display="none";
  scanFailures=0;scanStartedAt=Date.now();
  setResult("info","Camera ready — hold the full QR code steady in the scanning area.");
  // Enumerate only after Safari grants permission; labels may initially be blank.
  try{cameras=(await Html5Qrcode.getCameras())||[];fillCameraList()}catch(e){}
}
async function switchCamera(){
  if(cameraOpening||busy)return;
  cameraOpening=true;
  const previous=activeFacing;
  const target=previous==="environment"?"user":"environment";
  try{
    setResult("info","Switching to "+(target==="environment"?"rear":"front")+" camera...");
    await openCamera(target);
  }catch(e){
    cameraError(e);
    // Restore the last working camera if switching is unsupported.
    try{await openCamera(previous)}catch(recoveryError){cameraError(recoveryError)}
  }finally{cameraOpening=false}
}
async function stopCamera(){
  if(cameraOpening)return;
  cameraOpening=true;
  try{
    if(qr){if(qr.isScanning)await qr.stop();qr.clear();qr=null}
    document.getElementById("reader").innerHTML="";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("startBtn").style.display="block";
    document.getElementById("controls").style.display="none";
    setResult("info","Camera stopped.");
  }catch(e){cameraError(e)}
  finally{cameraOpening=false}
}

function manualCheckIn(){const e=document.getElementById("manualCode"),v=e.value.trim();if(!v)return setResult("error","<b>Enter a Player ID.</b>");e.value="";checkPlayer(v,false)}

function checkPlayer(raw,fromQr=false){
 const code=String(raw||"").trim().toUpperCase();if(!code)return;
 const now=Date.now();if(busy||(code===lastCode&&now-lastTime<3500))return;
 busy=true;lastCode=code;lastTime=now;
 if(fromQr){
   
   try{if(qr&&qr.isScanning)qr.pause(true)}catch(e){}
 }
 if(navigator.vibrate)navigator.vibrate(80);
 document.getElementById("nextBtn").style.display="none";
 setResult("info","Checking "+esc(code)+"...");
 const cb="ogc_"+Date.now()+"_"+Math.floor(Math.random()*100000);
 const tag=document.createElement("script");
 let timer=setTimeout(()=>finishError("Attendance server did not respond."),15000);
 function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(e){}if(tag.parentNode)tag.remove()}
 function finishError(m){cleanup();busy=false;setResult("error","<b>CONNECTION ERROR</b><br>"+esc(m));if(qr&&qr.isScanning)document.getElementById("nextBtn").style.display="block"}
 window[cb]=data=>{cleanup();displayResult(data||{ok:false,message:"Invalid server response."})};
 tag.onerror=()=>finishError("Could not connect to the Apps Script attendance server.");
 const p=new URLSearchParams({action:"checkin",code:code,device:"External QR Scanner",
callback:cb});
 tag.src=API_URL+"?"+p.toString();document.body.appendChild(tag);
}

function displayResult(d){
 if(d.ok){tone(true);
   setResult("success","<b>✅ "+esc(d.message)+"</b><div class='name'>"+esc(d.name)+"</div>"+esc(d.id)+"<br>"+esc(d.type||"")+(d.sponsor?"<br>"+esc(d.sponsor):"")+"<br><b>PAYMENT: "+esc(d.payment||"")+"</b><br>Check-in: "+esc(d.time||""));
 }else if(d.status==="payment_required" || d.status==="unpaid"){
    tone(false);if(navigator.vibrate)navigator.vibrate([180,80,180]);
    setResult("unpaid",
      "<div class='payment-stop'>⛔ NOT CHECKED IN</div>"+
      "<div class='name'>"+esc(d.name||"")+"</div>"+
      "<div class='id'>"+esc(d.id||"")+"</div>"+
      "<div class='payment'>PAYMENT: UNPAID</div>"+
      "<div class='payment-instruction'>Please proceed to the PAYMENT AREA first.</div>"+
      "<div style='margin-top:8px'>After payment is confirmed in the Registration sheet, scan the QR code again.</div>"
    );
  }else if(d.status==="duplicate"){tone(false);
   setResult("duplicate","<b>⚠️ "+esc(d.message)+"</b><div class='name'>"+esc(d.name)+"</div>"+esc(d.id)+"<br>First check-in: "+esc(d.firstCheckIn||""));
 }else{
   tone(false);
   setResult("error","<b>❌ "+esc(d.message||"CHECK-IN FAILED")+"</b><br>"+esc(d.id||""));
 }
 busy=false;
 const next=document.getElementById("nextBtn");
 if(qr&&qr.isScanning){ next.style.display="block"; }
 else { next.style.display="none"; }
}
function scanNextPlayer(){
 lastCode="";lastTime=0;busy=false;
 document.getElementById("nextBtn").style.display="none";
 try{
   if(qr&&qr.isScanning){
     qr.resume();
     setResult("info","Camera ready — scan the next player QR code.");
   }else{
     setResult("info","Press START CAMERA to scan the next player.");
   }
 }catch(e){
   setResult("error","<b>CAMERA ERROR</b><br>Could not resume camera. Press START CAMERA.");
   document.getElementById("startBtn").style.display="block";
 }
}

function cameraError(e){
 const n=e?.name||"",m=e?.message||String(e);let help="Press START CAMERA again or use manual check-in.";
 if(n==="NotAllowedError"||/permission|denied/i.test(m))help="Camera permission was denied for this website. Allow camera access in the browser and try again.";
 else if(n==="NotFoundError")help="No camera was found.";
 else if(n==="NotReadableError")help="Another app may be using the camera. Close it and try again.";
 setResult("error","<b>CAMERA ERROR</b><br>"+esc(help));document.getElementById("debug").textContent="Browser error: "+n+" — "+m;document.getElementById("startBtn").style.display="block";
  document.getElementById("controls").style.display="none";
}
</script>
</body>
</html>
